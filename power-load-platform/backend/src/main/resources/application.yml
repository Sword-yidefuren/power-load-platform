# ============================================================
#  Spring Boot 配置
# ============================================================
server:
  port: 8080

spring:
  application:
    name: power-load-backend

  datasource:
    # 注意三个关键参数，少一个就会报错：
    #   createDatabaseIfNotExist  -> 库不存在时自动建
    #   serverTimezone=Asia/Shanghai -> MySQL 8 时区必须显式指定
    #   characterEncoding=utf8    -> 中文不乱码
    url: jdbc:mysql://127.0.0.1:3306/power_load?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8

    # ============================================================
    #  ${环境变量名:默认值} 是 Spring 的占位符语法，冒号后面是默认值。
    #
    #  这样写的好处：
    #    1. 仓库里不再出现真实口令 —— 生产环境由运维/配置中心注入环境变量
    #    2. 本地开发不用配任何环境变量，直接用默认值就能跑起来
    #    3. 想覆盖时只要在启动前 set DB_USERNAME=xxx / set DB_PASSWORD=xxx
    #
    #  一句话："凭据走环境，仓库里只留占位符和一个方便演示的本地默认值。"
    # ============================================================
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # none = 不要自动改表结构。表由 db/init.sql 建好，更可控
      ddl-auto: none
    # 在日志里打印真实执行的 SQL —— 面试时可以直接展示"我懂 SQL"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    root: info
    com.example.powerload: debug
