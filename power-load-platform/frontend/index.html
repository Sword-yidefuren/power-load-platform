<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电力负荷数据可视化平台</title>
  </head>
  <body>
    <!--
      Vue 应用会挂载到这个 div 上。
      注意：这个文件"看起来"是个普通网页，但里面什么都没有 ——

      这就是 SPA（单页应用）：整个网站只有一个真正的 .html 文件。
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
